
services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    container_name: moneylens-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moneylens_ug}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Add POSTGRES_PASSWORD to your .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-moneylens_ug}
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI backend
  api:
    build:
      context: .
      target: api
    container_name: moneylens-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-moneylens_ug}
      APP_ENV: production
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Streamlit frontend
  frontend:
    build:
      context: .
      target: frontend
    container_name: moneylens-frontend
    restart: unless-stopped
    environment:
      MONEYLENS_API_URL: http://api:8000/api/v1
      STREAMLIT_SERVER_HEADLESS: "true"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"

volumes:
  postgres_data:
